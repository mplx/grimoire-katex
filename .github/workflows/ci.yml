#
# Formatting, lint and the unit tests, on every push and pull request.
#
# The tests typeset with tests/fake-katex, so the job needs no katex; the
# tests against the real katex run only where it is installed. The
# example book needs a Grimoire with the `mathml` feature and katex, and is
# checked locally with scripts/check-example.sh.

name: CI

on:
  push:
    branches: ['**']
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      # The official Jennifer image. `:dev` tracks main, which meets the
      # 0.27.0 floor in deck.toml. Hardcoded because
      # `container.image` does not take the `env` context.
      image: ghcr.io/jennifer-language/jennifer:dev
      # The image runs as a non-root user; the checked-out workspace belongs to
      # the runner.
      options: --user root
    steps:
      # The image carries the interpreter and nothing else, git included, which
      # actions/checkout needs.
      # GitHub mounts its own node into a job container; Forgejo's runner does
      # not, so there the JavaScript actions need Debian's.
      - name: Install git
        env:
          NODE: ${{ github.server_url != 'https://github.com' && 'nodejs' || '' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git $NODE
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Show the interpreter
        run: jennifer version

      - name: Format, lint and test
        run: scripts/test.sh
