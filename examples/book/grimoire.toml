#
# The demo book for grimoire-katex. Build it from this directory with a
# Grimoire that offers the `mathml` feature (0.5.0 or later):
#
#   grimoire build
#
# `scripts/check-example.sh` builds it and checks every edition.

[book]
title = "Maths"
description = "Display and inline maths, typeset as MathML while the book is built."
authors = ["mplx"]
language = "en"

[build]
src = "docs"
out = "site"

[pdf]
enabled = true

# The launcher in this repository, so the example needs nothing installed but
# Grimoire and katex. An installed plugin needs only the table name.
[preprocessor.katex]
command = "../../bin/grimoire-katex"

[preprocessor.katex.macros]
'\RR' = '\mathbb{R}'

[renderer.epub]
output = "maths.epub"
